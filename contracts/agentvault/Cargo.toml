[package]
name = "agentvault-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
